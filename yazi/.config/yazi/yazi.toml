[opener]
nvim = [
  { run = 'nvim "$@"', block = true, desc = "Neovim" },
]
okular = [
  { run = 'okular "$@"', block = false, orphan = true, desc = "Okular" },
]
edge = [
  { run = 'microsoft-edge-stable "$@"', block = false, orphan = true, desc = "Edge" },
]
image = [
  { run = 'xdg-open "$@"', block = false },
]
video = [
  { run = 'xdg-open "$@"', orphan = true, block = false },
]
default = [
  { run = 'xdg-open "$@"', block = false },
]

[open]
prepend_rules = [
  { mime = "application/pdf", use = "edge" },
  { url = "*.{cbr,cbz}", use = "okular" },
  # Text & config files
  { mime = "text/*", use = "nvim" },
  { mime = "application/json", use = "nvim" },
  { mime = "application/xml", use = "nvim" },
  { mime = "application/javascript", use = "nvim" },
  { mime = "application/x-shellscript", use = "nvim" },
  # Programming files by extension (fallback for undetected mimes)
  { url = "*.{py,rs,go,c,cpp,h,hpp,java,kt,rb,php,swift,ts,tsx,jsx,vue,lua,vim,toml,yaml,yml,ini,cfg,conf,md,rst,txt,sh,bash,zsh,fish,css,scss,html,htm,sql}", use = "nvim" },
]
