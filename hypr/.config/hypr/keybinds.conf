exec = hyprctl dispatch submap globexec = hyprctl dispatch submap global
submap = global

# =========================================================
# Launcher / Shell
# =========================================================

bind = SUPER, A, exec, pkill fuzzel || fuzzel

# =========================================================
# Applications
# =========================================================

bind = Super, T, exec, kitty
bind = Super, F, exec, zen-browser
bind = Super, E, exec, kitty -e yazi
bind = Super, N, exec, kitty -e nvim
bind = Super+Ctrl, V, exec, pavucontrol
bind = Ctrl+Shift, Escape, exec, kitty -e htop

# =========================================================
# Floating / Window Controls
# =========================================================

bind = Alt, return, fullscreen, 0
bind = Super, W, togglefloating,
bind = Super, Q, killactive,

bindm = Super, mouse:272, movewindow
bindm = Super, Z, movewindow

bindm = Super, mouse:273, resizewindow
bindm = Super, X, resizewindow

# Focus movement
bind = Super, Left, movefocus, l
bind = Super, Right, movefocus, r
bind = Super, Up, movefocus, u
bind = Super, Down, movefocus, d

# Move windows
bind = Super+Shift, Left, movewindow, l
bind = Super+Shift, Right, movewindow, r
bind = Super+Shift, Up, movewindow, u
bind = Super+Shift, Down, movewindow, d

# =========================================================
# Special Workspace
# =========================================================

bind = Super, S, togglespecialworkspace,
bind = Super+Alt, S, movetoworkspacesilent, special

# Move window to/from special workspace
bind = Ctrl+Super+Shift, up, movetoworkspace, special:special
bind = Ctrl+Super+Shift, down, movetoworkspace, e+0

# =========================================================
# Workspaces
# =========================================================

# Move focused window to workspace
bind = Super+Shift, 1, movetoworkspace, 1
bind = Super+Shift, 2, movetoworkspace, 2
bind = Super+Shift, 3, movetoworkspace, 3
bind = Super+Shift, 4, movetoworkspace, 4
bind = Super+Shift, 5, movetoworkspace, 5
bind = Super+Shift, 6, movetoworkspace, 6
bind = Super+Shift, 7, movetoworkspace, 7
bind = Super+Shift, 8, movetoworkspace, 8
bind = Super+Shift, 9, movetoworkspace, 9
bind = Super+Shift, 0, movetoworkspace, 10

# Go to workspace
bind = Super, 1, workspace, 1
bind = Super, 2, workspace, 2
bind = Super, 3, workspace, 3
bind = Super, 4, workspace, 4
bind = Super, 5, workspace, 5
bind = Super, 6, workspace, 6
bind = Super, 7, workspace, 7
bind = Super, 8, workspace, 8
bind = Super, 9, workspace, 9
bind = Super, 0, workspace, 10

# Workspace cycling
bind = Super, mouse_down, workspace, -1
bind = Super, mouse_up, workspace, +1

binde = Ctrl+Super, left, workspace, -1
binde = Ctrl+Super, right, workspace, +1

binde = Super, Page_Up, workspace, -1
binde = Super, Page_Down, workspace, +1

# Move window to workspace +/-1
binde = Ctrl+Super+Shift, right, movetoworkspace, +1
binde = Ctrl+Super+Shift, left, movetoworkspace, -1

# =========================================================
# Screenshot / Picker
# =========================================================

bind = Super, P, exec, bash -c 'mkdir -p ~/Pictures/Screenshots && grimblast copysave area ~/Pictures/Screenshots/Screenshot_"$(date +%Y-%m-%d_%H.%M.%S)".png'

bind = Super+Shift, P, exec, bash -c 'mkdir -p ~/Pictures/Screenshots && grimblast --freeze copysave area ~/Pictures/Screenshots/Screenshot_"$(date +%Y-%m-%d_%H.%M.%S)".png'

bind = Super+Shift, C, exec, hyprpicker -a

# =========================================================
# Clipboard / Emoji
# =========================================================

bind = Super, V, exec, pkill fuzzel || cliphist list | fuzzel --match-mode fzf --dmenu | cliphist decode | wl-copy

bind = SUPER, PERIOD, exec, pkill fuzzel || ~/.local/share/bin/fuzzel-emoji

# =========================================================
# Bar / UI
# =========================================================

bind = SUPER, H, exec, /home/talal/.local/share/bin/toggle-waybar

# =========================================================
# Keyboard Layout
# =========================================================

bind = Super, K, exec, hyprctl switchxkblayout all next

# =========================================================
# GPU Screen Recorder
# =========================================================

bind = SUPER + CTRL, F10, exec, ~/.local/bin/save-replay.sh

# =========================================================
# Notifications / Testing
# =========================================================

bind = Super+Alt, f12, exec, notify-send -u low -i dialog-information-symbolic 'Test notification' "Here's a really long message to test truncation and wrapping\nYou can middle click or flick this notification to dismiss it!" -a 'Shell' -A "Test1=I got it!" -A "Test2=Another action"

# =========================================================
# Audio Controls
# =========================================================

# Volume
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+

bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# Microphone
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# =========================================================
# Brightness Controls
# =========================================================

bindl = , XF86MonBrightnessUp, global, brightnessUp
bindl = , XF86MonBrightnessDown, global, brightnessDown

bindle = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# =========================================================
# Bluetooth
# =========================================================

bind = , F10, exec, sh -c 'if [ $(bluetoothctl show | grep "Powered: yes" | wc -l) -gt 0 ]; then bluetoothctl power off && notify-send "Bluetooth" "Powered Off"; else bluetoothctl power on && notify-send "Bluetooth" "Powered On"; fi'

bind = , XF86PickupPhone, exec, rfkill toggle bluetooth

# =========================================================
# ThinkPad Keyboard Backlight
# =========================================================

# Cycle through states and wrap around back to 0
bind = , XF86HangupPhone, exec, sh -c 'CUR=$(brightnessctl -d tpacpi::kbd_backlight g); NEXT=$(( (CUR + 1) % 3 )); brightnessctl -d tpacpi::kbd_backlight set $NEXT'a
