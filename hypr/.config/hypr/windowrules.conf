########################################################
# WINDOW RULES (NEW SYSTEM)
############################

############################
# Steam (XWayland – HARD OVERRIDES)
############################

# Steam main window & Steam games
windowrule = tile on, match:class ^(steam|Steam)$
windowrule = tile on, match:class ^steam_app_.*$

# Steam dialogs
windowrule = float on, match:title ^(Steam Settings|Friends List|Screenshot Uploader|Steam Guard|Add a Game)$


############################
# Applications
############################

# Warp
windowrule = tile on, match:class ^dev\.warp\.Warp$

# System utilities
windowrule = float on, match:class ^(org\.pulseaudio\.pavucontrol|nwg-look|blueman-manager|nm-connection-editor)$

# Media
windowrule = float on, match:class ^mpv$

# GNOME Calculator
windowrule = float on, match:class ^org\.gnome\.Calculator$

# GNOME Loupe
windowrule = float on, center on, size 800 600, match:class ^org\.gnome\.Loupe$


############################
# VS Code
############################

windowrule = border_size 0, match:class ^code$


############################
# wlogout
############################

windowrule = float on, fullscreen on, no_anim on, match:class ^wlogout$


############################
# Dialogs (SAFE FLOATING)
############################

windowrule = float on, center on, match:title ^(Open File|Select a File|Choose wallpaper|Open Folder|Save As|File Upload)$


############################
# Picture-in-Picture
############################

windowrule = float on, pin on, keep_aspect_ratio on, move 73% 72%, size 25%, match:title ^Picture(-| )in(-| )[Pp]icture$


############################
# Tiled window styling
############################

windowrule = no_shadow on, match:float false


############################
# OBS
############################

windowrule = rounding 20, no_blur on, match:class ^com\.obsproject\.Studio$

