# ✅ Uncommented Béziers so Hyprland can use them
bezier = wind, 0.05, 0.9, 0.1, 1.05
bezier = md3_decel, 0.05, 0.7, 0.1, 1
bezier = overshot, 0.05, 0.9, 0.1, 1.1
bezier = menu_decel, 0.1, 1, 0, 1
bezier = menu_accel, 0.38, 0.04, 1, 0.07
bezier = easeOutExpo, 0.16, 1, 0.3, 1
bezier = fluent_edge, 0.36, 0, 0.66, -0.56
bezier = easeOutQuint, 0.23, 1, 0.32, 1

animations {
    enabled = true

    # Default Bézier
    bezier = myBezier, 0.4, 0.0, 0.2, 1.0

    # Window Animations
    animation = windows, 1, 2.5, myBezier, popin 80%
    animation = border, 1, 2.5, myBezier
    animation = workspaces, 1, 7, menu_decel, slide

    # Fades (Unified fallback tree)
    animation = fade, 1, 2.5, myBezier
    animation = fadeIn, 1, 3, myBezier
    animation = fadeOut, 1, 3, myBezier
    animation = fadeSwitch, 1, 3, myBezier
    animation = fadeShadow, 1, 3, myBezier
    animation = fadeDim, 1, 3, myBezier

    # Layer Shell Animations (Used by Fuzzel, Waybar, etc.)
    animation = layersIn, 1, 3, menu_decel, slide
    animation = layersOut, 1, 1.6, menu_accel, slide
    animation = fadeLayersIn, 1, 2, overshot
    animation = fadeLayersOut, 1, 5, easeOutExpo

    # Special Workspaces
    animation = specialWorkspaceIn, 1, 3, md3_decel, slidevert
    animation = specialWorkspaceOut, 1, 3, md3_decel, slidevert
}
